[package]
name = "opensearch-parquet-format"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
workspace = "../../../../../libs/dataformat-native/rust"

[features]
test-utils = []

[lib]
name = "opensearch_parquet_format"
crate-type = ["rlib"]

[dependencies]
arrow = { workspace = true }
parquet = { workspace = true }
arrow-ipc = { workspace = true }
lazy_static = { workspace = true }
dashmap = { workspace = true }
tempfile = { workspace = true }
native-bridge-common = { workspace = true }
rayon = { workspace = true }
tokio = { workspace = true }
crc32fast = { workspace = true }
serde_json = { workspace = true }
liquid-cache = { workspace = true }
t4 = { workspace = true }
# Hard dep on the DataFusion engine: the codec is DataFusion's DSL fallback (queries whose
# RelNode conversion is unsupported route here), so it adopts DF's shared liquid cache instead
# of building its own. Acyclic — opensearch-datafusion does not depend on parquet-data-format.
opensearch-datafusion = { path = "../../../../analytics-backend-datafusion/rust" }
liquid-cache-datafusion = { workspace = true }

[dev-dependencies]
opensearch-parquet-format = { path = ".", features = ["test-utils"] }


[[bench]]
name = "merge_projection_bench"
harness = false
